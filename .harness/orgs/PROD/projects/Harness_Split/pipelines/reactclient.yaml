pipeline:
  name: react-client-repo
  identifier: reactclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: react-client
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Node
                  identifier: Install_Node
                  spec:
                    shell: Bash
                    command: |-
                      curl https://mise.run | sh
                      export PATH="$HOME/.local/bin:$PATH"
                      mise use --global node@<+matrix.nodeVersion>
                      node --version
                      npm --version
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm ci
              - step:
                  type: Run
                  name: Run Checks
                  identifier: Run_Checks
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run check
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run test
              - step:
                  type: Run
                  name: Run Build
                  identifier: Run_Build
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run build
              - step:
                  type: Run
                  name: SonarQube Scan
                  identifier: SonarQube_Scan
                  when:
                    stageStatus: Success
                    condition: <+matrix.nodeVersion> == "lts"
                  spec:
                    connectorRef: account.harnessImage
                    image: sonarsource/sonar-scanner-cli
                    shell: Bash
                    command: |
                      set -euo pipefail

                      COMMON_ARGS="
                        -Dsonar.host.url=https://sonar.harness.io
                        -Dsonar.token=$SONAR_TOKEN
                        -Dsonar.projectKey=react-client
                        -Dsonar.sources=src
                        -Dsonar.tests=src/__tests__
                        -Dsonar.exclusions=**/node_modules/**,**/umd/**,**/es/**,**/lib/**,src/__tests__/**
                        -Dsonar.scanner.skipJreProvisioning=true
                        -Dsonar.scanner.skipSystemTruststore=true
                      "

                      if [ "<+codebase.prNumber>" != "" ] && [ "<+codebase.prNumber>" != "null" ]; then
                        echo "Pull Request Analysis"
                        sonar-scanner \
                          $COMMON_ARGS \
                          -Dsonar.pullrequest.key=<+codebase.prNumber> \
                          -Dsonar.pullrequest.branch=<+codebase.sourceBranch> \
                          -Dsonar.pullrequest.base=<+codebase.targetBranch>
                      else
                        echo "Branch Analysis"
                        sonar-scanner \
                          $COMMON_ARGS \
                          -Dsonar.branch.name=<+codebase.branch>
                      fi
                    envVariables:
                      SONAR_TOKEN: <+secrets.getValue("sonarqube-token")>
                  timeout: 10m
        strategy:
          matrix:
            nodeVersion:
              - "lts"
